name: Create UPM Package

on:
  push:
    branches:
      - main

jobs:
  create-upm-package:
    runs-on: ubuntu-latest
    # Pushing the release tag needs write access; new repositories default to read-only tokens.
    permissions:
      contents: write

    steps:
      # Get commit message from event payload
      - name: Get commit message
        id: get_commit_message
        run: |
          {
            echo 'COMMIT_MESSAGE<<EOF'
            echo "${{ github.event.head_commit.message }}" | head -n 1
            echo 'EOF'
          } >> $GITHUB_ENV

      - uses: actions/checkout@v4

      # Check if commit message starts with 'v'
      - name: Check if commit message starts with 'v'
        if: startsWith(env.COMMIT_MESSAGE, 'v')
        run: |
          # Load the environment variable
          message="$COMMIT_MESSAGE"
          echo "Commit message starts with 'v': $message"

          # Tag name is the first word without the leading 'v' ("v0.6.0 Notes" -> "0.6.0")
          tag_name="${message%% *}"
          tag_name="${tag_name:1}"
          echo "Derived tag name: $tag_name"

          # Perform subtree split
          git subtree split --prefix=Assets/RicKit/AutoUI --branch upm
          echo "Subtree split completed. Branch 'upm' created."

          # Create and push the tag
          git tag "$tag_name" upm
          git push origin "$tag_name"
          echo "Tag '$tag_name' pushed to origin."
